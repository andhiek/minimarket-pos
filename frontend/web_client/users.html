<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manajemen Karyawan - Minimarket POS</title>
    <!-- CSS Utama -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/product.css" />
    <link rel="stylesheet" href="css/users.css" />
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="js/auth.js"></script>
    <style>
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: #1e1e2e;
        border: 1px solid #313244;
        border-radius: 10px;
        padding: 16px;
        display: flex;
        flex-direction: column;
      }
      .stat-title {
        font-size: 0.8rem;
        color: #a6adc8;
        font-weight: 500;
        margin-bottom: 6px;
      }
      .stat-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: #cdd6f4;
      }
      .toolbar-flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .search-box-wrapper {
        position: relative;
        flex: 1;
      }
      .search-box-wrapper input {
        width: 100%;
        padding: 10px 14px 10px 38px;
        background: #1e1e2e;
        border: 1px solid #313244;
        border-radius: 8px;
        color: #cdd6f4;
        font-size: 0.9rem;
      }
      .search-box-wrapper i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #6c7086;
      }
    </style>
  </head>
  <body>
    <!-- Header Bar Universal -->
    <div class="header-bar">
      <h2>👥 Manajemen Karyawan & Kasir</h2>
      <div class="nav-tabs">
        <a href="index.html" class="nav-tab-item">Kasir</a>
        <a href="products.html" class="nav-tab-item">Kelola Produk</a>
        <a href="reports.html" class="nav-tab-item" id="nav-reports">Laporan</a>
        <a href="users.html" class="nav-tab-item active" id="nav-users">Karyawan</a>
      </div>
    </div>

    <!-- Konten Utama -->
    <div style="padding: 24px">
      <!-- Kartu Statistik Ringkasan -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-title">Total Karyawan</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">Administrator</span>
          <span class="stat-value" id="stat-admin" style="color: #89b4fa">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">Kasir Aktif</span>
          <span class="stat-value" id="stat-kasir" style="color: #a6e3a1">0</span>
        </div>
      </div>

      <!-- Toolbar Pencarian & Tombol Tambah yang Rapi (Filter role dihapus) -->
      <div class="toolbar-flex">
        <div class="search-box-wrapper">
          <i class="fa-solid fa-search"></i>
          <input type="text" id="searchInput" placeholder="Cari berdasarkan NIK, Nama, atau Username..." onkeyup="filterUsers()" />
        </div>

        <button class="btn" onclick="openModal()" style="display: flex; align-items: center; gap: 8px; padding: 10px 16px; white-space: nowrap"><i class="fa-solid fa-user-plus"></i> Tambah Karyawan</button>
      </div>

      <!-- Tabel Data Karyawan -->
      <div class="card">
        <table>
          <thead>
            <tr>
              <th style="width: 50px; text-align: center">No</th>
              <th style="width: 140px">NIK</th>
              <th>Nama Lengkap</th>
              <th style="width: 130px">Username</th>
              <th style="width: 140px">Kontak (No. HP)</th>
              <th style="width: 100px; text-align: center">Role</th>
              <th style="width: 100px; text-align: center">Status</th>
              <th style="width: 80px; text-align: center">Aksi</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <!-- Data dirender dinamis via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Modal Tambah/Edit Karyawan -->
    <div id="userModal" class="modal">
      <div class="modal-content">
        <h2 id="modalTitle" style="margin-bottom: 16px; font-size: 1.2rem">Tambah Karyawan Baru</h2>
        <form id="userForm" onsubmit="saveUser(event)">
          <div class="form-group">
            <label>Nomor Induk Karyawan (NIK)</label>
            <input type="text" id="nik" required autocomplete="off" placeholder="Contoh: EMP001" />
          </div>
          <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="full_name" required autocomplete="off" placeholder="Nama lengkap karyawan" />
          </div>
          <div class="form-group">
            <label>Username untuk Login</label>
            <input type="text" id="username" required autocomplete="off" placeholder="Contoh: bayoe" />
          </div>
          <div class="form-group">
            <label>Password Login <small style="color: var(--text-muted); font-weight: normal">(Kosongkan jika tidak ingin mengubah saat edit)</small></label>
            <input type="password" id="password" autocomplete="new-password" placeholder="Masukkan password kasir" />
          </div>
          <div class="form-group">
            <label>Nomor HP / WhatsApp</label>
            <input type="tel" id="phone" autocomplete="off" placeholder="Contoh: 081234567890" />
          </div>
          <div class="form-group">
            <label>Alamat Lengkap</label>
            <textarea id="address" autocomplete="off" placeholder="Alamat domisili karyawan..."></textarea>
          </div>
          <div class="form-group">
            <label>Role / Hak Akses</label>
            <select id="role">
              <option value="KASIR">KASIR</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Batal</button>
            <button type="submit" class="btn">Simpan</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Script Karyawan -->
    <script src="js/users.js"></script>
  </body>
</html>
