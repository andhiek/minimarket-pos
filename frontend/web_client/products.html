<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manajemen Produk - Spreadsheet View</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/product.css" />
    <style></style>
  </head>
  <body>
    <div class="header-bar">
      <h2>📊 Database Produk (Excel View)</h2>
      <div class="nav-tabs">
        <a href="index.html" class="nav-tab-item">Kasir</a>
        <a href="products.html" class="nav-tab-item active">Kelola Produk</a>
        <a href="reports.html" class="nav-tab-item" id="nav-reports">Laporan</a>
      </div>
    </div>

    <!-- Controls Atas -->
    <div class="top-controls">
      <div class="left-controls">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Cari nama produk atau barcode..." />
        <button id="btn-bulk-delete" class="btn-top btn-bulk-delete">🗑️ Hapus Terpilih (<span id="selected-count">0</span>)</button>
      </div>

      <div class="right-controls" id="admin-actions">
        <input type="file" id="import-file" accept=".csv" style="display: none" />
        <button class="btn-top btn-import" id="btn-import">📥 Import CSV</button>
        <button class="btn-top btn-export" id="btn-export">📤 Export CSV</button>
        <button class="btn-top btn-add" id="btn-add-row">➕ Tambah Baris</button>
      </div>
    </div>

    <div class="excel-table-container">
      <table class="excel-table">
        <thead>
          <tr id="table-header">
            <th id="th-select" style="width: 35px; text-align: center">
              <input type="checkbox" id="select-all-checkbox" />
            </th>
            <th style="width: 40px; text-align: center">No</th>
            <th style="width: 150px">Barcode</th>
            <th>Nama Produk</th>
            <th style="width: 160px">Kategori</th>
            <th style="width: 130px; text-align: right">Harga Beli (Rp)</th>
            <th style="width: 130px; text-align: right">Harga Jual (Rp)</th>
            <th style="width: 70px; text-align: center">Stok</th>
            <th id="th-aksi" style="width: 90px; text-align: center">Aksi</th>
          </tr>
        </thead>
        <tbody id="excel-tbody">
          <!-- Data produk dirender secara dinamis -->
        </tbody>
      </table>
    </div>

    <!-- Script logika eksternal -->
    <script src="js/products.js"></script>
  </body>
</html>
