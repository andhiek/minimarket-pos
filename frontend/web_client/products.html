<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manajemen Produk - Spreadsheet View</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- ZXing Library untuk Scanner Barcode Gambar -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
    <link rel="stylesheet" href="css/product.css" />
    <script src="js/auth.js"></script>
  </head>
  <body>
    <div class="header-bar">
      <h2>📊 Database Produk (Excel View)</h2>
      <div class="nav-tabs">
        <a href="index.html" class="nav-tab-item">Kasir</a>
        <a href="products.html" class="nav-tab-item active">Kelola Produk</a>
        <a href="reports.html" class="nav-tab-item" id="nav-reports">Laporan</a>
      </div>
    </div>

    <!-- Controls Atas -->
    <div class="top-controls">
      <div class="left-controls">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Cari nama produk atau barcode..." />
        <button id="btn-bulk-delete" class="btn-top btn-bulk-delete">🗑️ Hapus Terpilih (<span id="selected-count">0</span>)</button>
      </div>

      <div class="right-controls" id="admin-actions">
        <input type="file" id="import-file" accept=".csv" style="display: none" />

        <!-- Tombol Import CSV dengan Gaya Modern & Elegan -->
        <button class="btn-top" id="btn-import" style="background: #313244; color: #38bdf8; border: 1px solid #45475a; transition: all 0.2s ease" title="Impor Data Produk dari CSV">📥 Import CSV</button>

        <!-- Tombol Export CSV dengan Gaya Modern & Elegan -->
        <button class="btn-top" id="btn-export" style="background: #313244; color: #34d399; border: 1px solid #45475a; transition: all 0.2s ease" title="Ekspor Data Produk ke CSV">📤 Export CSV</button>

        <button class="btn-top btn-add" id="btn-add-row">➕ Tambah Prod</button>

        <!-- Tombol Scan Barcode -->
        <button class="btn-top" id="btn-open-scanner" onclick="triggerProductCamera()" style="background: #313244; color: #89b4fa; border: 1px solid #45475a" title="Scan Barcode via Kamera">📷 Scan Barcode</button>
      </div>
    </div>

    <div class="excel-table-container">
      <table class="excel-table">
        <thead>
          <tr id="table-header">
            <th id="th-select" style="width: 35px; text-align: center">
              <input type="checkbox" id="select-all-checkbox" />
            </th>
            <th style="width: 40px; text-align: center">No</th>
            <th style="width: 150px">Barcode</th>
            <th>Nama Produk</th>
            <th style="width: 160px">Kategori</th>
            <th style="width: 130px; text-align: right">Harga Beli (Rp)</th>
            <th style="width: 130px; text-align: right">Harga Jual (Rp)</th>
            <th style="width: 90px; text-align: center">Diskon (%)</th>
            <th style="width: 70px; text-align: center">Stok</th>
            <th id="th-aksi" style="width: 90px; text-align: center">Aksi</th>
          </tr>
        </thead>
        <tbody id="excel-tbody">
          <!-- Data produk dirender secara dinamis -->
        </tbody>
      </table>
    </div>

    <!-- Modal Scanner Kamera Elegan untuk Admin Gudang -->
    <div class="modal-overlay" id="modal-admin-camera">
      <div class="modal-card" style="width: 420px; max-width: 95%; background: #1e1e2e; border: 1px solid #313244; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5)">
        <div class="modal-header" style="background: #181825; padding: 16px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center">
          <div class="modal-title" style="color: #cdd6f4; font-weight: 600; font-size: 1rem">📷 Scan Barcode Produk Baru</div>
          <button class="modal-close" onclick="closeAdminCameraModal()" style="background: none; border: none; color: #a6adc8; font-size: 1.2rem; cursor: pointer">✖</button>
        </div>
        <div class="modal-body" style="padding: 20px; text-align: center">
          <p style="color: #a6adc8; font-size: 0.85rem; margin-bottom: 15px">Ambil foto kemasan produk atau unggah gambar barcode dari perangkat Anda.</p>

          <!-- Kotak Interaktif dengan Label & Input Native yang Sempurna untuk HP -->
          <label for="admin-camera-file" style="display: block; border: 2px dashed #45475a; border-radius: 10px; padding: 30px; background: #11111b; cursor: pointer; transition: all 0.3s ease">
            <div style="font-size: 40px; margin-bottom: 10px">📸</div>
            <div style="color: #89b4fa; font-weight: 600; font-size: 0.95rem">Ketuk untuk Ambil Foto / Pilih File</div>
            <div style="color: #6c7086; font-size: 0.75rem; margin-top: 4px">Mendukung kamera HP langsung & galeri</div>

            <!-- Input file ditempatkan di dalam label agar sentuhan langsung mentrigger kamera -->
            <input type="file" id="admin-camera-file" accept="image/*" capture="environment" style="display: none" onchange="processAdminCameraScan(event)" />
          </label>

          <div id="scan-loading-indicator" style="display: none; margin-top: 15px; color: #f9e2af; font-size: 0.85rem">⏳ Sedang memproses dan membaca piksel barcode...</div>
        </div>
        <div class="modal-footer" style="background: #181825; padding: 12px 16px; border-top: 1px solid #313244; display: flex; justify-content: flex-end">
          <button class="btn-secondary" onclick="closeAdminCameraModal()" style="background: #313244; color: #cdd6f4; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer">Tutup</button>
        </div>
      </div>
    </div>

    <!-- Script logika eksternal -->
    <script src="js/products.js"></script>
  </body>
</html>
