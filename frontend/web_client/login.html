<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Minimarket POS</title>
    <!-- Framework & Icon Library -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      /* Background Subtle Pattern & Smooth Styling */
      body {
        background-color: #0f172a; /* Slate 900 */
        background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.8) 0px, transparent 50%);
      }
    </style>
  </head>
  <body class="h-screen flex items-center justify-center font-sans antialiased selection:bg-indigo-500 selection:text-white px-4">
    <!-- Card Container Utama Form Login -->
    <div class="bg-slate-800/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700/60 relative overflow-hidden">
      <!-- Accent Top Glow Line -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-500"></div>

      <!-- Header Logo & Judul -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl mb-4 border border-indigo-500/30 shadow-inner">
          <i class="fa-solid fa-store text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-white tracking-tight">Minimarket POS</h2>
        <p class="text-xs text-slate-400 mt-1.5">Silakan login untuk mengakses sistem kasir</p>
      </div>

      <!-- Alert Pesan Error (Ditampilkan secara dinamis jika login gagal) -->
      <div id="error-alert" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-xs p-3.5 rounded-xl mb-5 text-center items-center justify-center gap-2">
        <i class="fa-solid fa-circle-exclamation text-sm"></i>
        <span id="error-text"></span>
      </div>

      <!-- Form Otentikasi -->
      <form id="login-form" class="space-y-5">
        <!-- Input Username -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
              <i class="fa-solid fa-user text-sm"></i>
            </span>
            <input
              type="text"
              id="username"
              required
              placeholder="Masukkan username"
              autocomplete="username"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200" />
          </div>
        </div>

        <!-- Input Password -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
              <i class="fa-solid fa-lock text-sm"></i>
            </span>
            <input
              type="password"
              id="password"
              required
              placeholder="Masukkan password"
              autocomplete="current-password"
              class="w-full pl-10 pr-10 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200" />
            <!-- Toggle Visibility Password -->
            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 focus:outline-none" title="Tampilkan/Sembunyikan Password">
              <i class="fa-solid fa-eye text-sm" id="toggle-icon"></i>
            </button>
          </div>
        </div>

        <!-- Tombol Submit -->
        <button
          type="submit"
          id="btn-submit"
          class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition duration-200 shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 mt-2">
          <span>Masuk ke System</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>
    </div>

    <!-- Script Pengolahan Form Login -->
    <script>
      // 1. Penentuan Base URL API Backend (Mendukung path relatif & fallback ke host aktif)
      const API_BASE_URL = "http://127.0.0.1:8000/api";

      // Toggle Show/Hide Password
      const togglePassword = document.getElementById("toggle-password");
      const passwordInput = document.getElementById("password");
      const toggleIcon = document.getElementById("toggle-icon");

      togglePassword.addEventListener("click", () => {
        const isPassword = passwordInput.getAttribute("type") === "password";
        passwordInput.setAttribute("type", isPassword ? "text" : "password");
        toggleIcon.classList.toggle("fa-eye", !isPassword);
        toggleIcon.classList.toggle("fa-eye-slash", isPassword);
      });

      // Submit Form Handler
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value; // Tanpa .trim()
        const errAlert = document.getElementById("error-alert");
        const errText = document.getElementById("error-text");
        const btnSubmit = document.getElementById("btn-submit");

        errAlert.classList.add("hidden");
        errAlert.classList.remove("flex");

        // Set Loading State pada Tombol
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin text-sm"></i> <span>Memproses...</span>`;

        try {
          // Memanggil endpoint backend secara pasti ke http://127.0.0.1:8000/api/auth/login
          const res = await fetch(`${API_BASE_URL}/auth/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password }),
          });

          const data = await res.json();

          if (res.ok) {
            // Login Berhasil
            localStorage.setItem("pos_current_user", JSON.stringify(data));
            // Catat waktu login awal untuk inactivity tracker
            localStorage.setItem("pos_login_time", Date.now().toString());
            window.location.href = "index.html";
          } else {
            // Login Gagal (401 Unauthorized / Bad Request)
            errText.innerText = data.detail || "Username atau password salah!";
            errAlert.classList.remove("hidden");
            errAlert.classList.add("flex");
          }
        } catch (err) {
          console.error("Fetch error:", err);
          errText.innerText = "Tidak dapat terhubung ke server FastAPI (Port 8000).";
          errAlert.classList.remove("hidden");
          errAlert.classList.add("flex");
        } finally {
          // Reset State Tombol
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = `<span>Masuk ke System</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
        }
      });
    </script>
  </body>
</html>
